<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Merci — SR-IT</title>
<style>
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#071a36;color:white;display:grid;place-items:center;min-height:100vh}
.card{max-width:680px;margin:24px;background:white;color:#0c1f3d;border-radius:22px;padding:42px;box-shadow:0 24px 60px rgba(0,0,0,.25)}
h1{margin:0 0 14px;font-size:38px}.accent{color:#2368e8}p{color:#536681;line-height:1.65}
a{display:inline-block;margin-top:16px;padding:12px 18px;border-radius:12px;background:#2368e8;color:white;text-decoration:none;font-weight:700}

/* ===== V33 — correctifs d'affichage globaux ===== */
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;overflow-x:hidden}
body{overflow-x:hidden}
img,svg,video{max-width:100%;height:auto}
a{overflow-wrap:anywhere}
section{scroll-margin-top:88px}

@media (max-width: 900px){
  .container{
    width:auto !important;
    max-width:none !important;
    margin-left:18px !important;
    margin-right:18px !important;
  }
  .hero .grid,
  .article-layout,
  .training-wrap,
  .smart-shell,
  .contact-grid,
  .usecase-grid,
  .services-grid,
  .pillars,
  .formats-grid,
  .program-grid{
    grid-template-columns:1fr !important;
  }
  h1{font-size:clamp(34px,9vw,54px) !important;line-height:1.02 !important}
  h2{font-size:clamp(28px,7.5vw,42px) !important;line-height:1.08 !important}
  h3{line-height:1.2 !important}
  p,li{overflow-wrap:anywhere}
  .hero{padding-top:34px !important}
  .hero .grid{gap:26px !important}
  .smart-form,.smart-aside,.training-side,.article,.aside-card{min-width:0 !important}
  input,textarea,select,button{max-width:100% !important}
}

@media (max-width: 520px){
  .container{
    margin-left:16px !important;
    margin-right:16px !important;
  }
  section{padding-left:0 !important;padding-right:0 !important}
  .card,.service,.pillar,.format,.train,.program,.smart-form,.smart-aside,.article,.aside-card{
    border-radius:16px !important;
  }
}


/* ===== V66 — harmonisation professionnelle globale ===== */
:root{
  --srit-navy:#0b2b55;
  --srit-blue:#2468e8;
  --srit-cyan:#29b7dc;
  --srit-orange:#f48a37;
  --srit-text:#163257;
  --srit-muted:#5f7391;
  --srit-line:#dce6f2;
  --srit-soft:#f5f8fc;
  --srit-radius:18px;
  --srit-shadow:0 12px 32px rgba(14,43,82,.08);
}

html{scroll-behavior:smooth}
body{
  color:var(--srit-text);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

/* Conteneurs et rythme */
.container{
  width:min(1180px,calc(100% - 40px)) !important;
  margin-left:auto !important;
  margin-right:auto !important;
}
section{scroll-margin-top:92px}
h1,h2,h3{letter-spacing:-.02em}
p{line-height:1.65}

/* Header commun */
.topbar{
  background:rgba(255,255,255,.97) !important;
  border-bottom:1px solid rgba(209,222,239,.9) !important;
  box-shadow:0 6px 18px rgba(15,43,80,.045) !important;
  backdrop-filter:blur(10px);
  z-index:1000;
}
.topbar .inner{
  min-height:76px !important;
  display:flex !important;
  align-items:center !important;
  gap:22px !important;
}
.logo{
  max-height:46px !important;
  width:auto !important;
}
.nav{
  display:flex !important;
  align-items:center !important;
  gap:20px !important;
  margin-left:auto !important;
  flex-wrap:nowrap !important;
}
.nav a{
  color:#223a5d !important;
  font-size:14px !important;
  font-weight:700 !important;
  text-decoration:none !important;
  white-space:nowrap !important;
  transition:color .18s ease,background .18s ease,transform .18s ease !important;
}
.nav a:not(.nav-cta):hover{color:var(--srit-blue) !important}
.nav .nav-cta{
  padding:12px 16px !important;
  border-radius:13px !important;
  color:#fff !important;
  background:linear-gradient(135deg,var(--srit-blue),var(--srit-cyan)) !important;
  border:0 !important;
  box-shadow:0 10px 22px rgba(36,104,232,.20) !important;
}
.nav .nav-cta:hover{transform:translateY(-1px) !important}

/* Boutons */
.btn,.btn.primary,.btn.btn-primary,.mobile-need-btn{
  border-radius:13px !important;
  font-weight:800 !important;
  text-decoration:none !important;
}
.btn.primary,.btn.btn-primary,.mobile-need-btn{
  background:linear-gradient(135deg,var(--srit-blue),var(--srit-cyan)) !important;
  color:#fff !important;
  border:0 !important;
  box-shadow:0 10px 24px rgba(36,104,232,.18) !important;
}
.btn.btn-secondary{
  background:#fff !important;
  color:var(--srit-navy) !important;
  border:1px solid var(--srit-line) !important;
}

/* Badges / kickers */
.kicker,.tag{
  border-radius:999px !important;
  font-weight:800 !important;
  letter-spacing:.07em !important;
}
.kicker{
  border:1px solid rgba(244,138,55,.45) !important;
  background:rgba(244,138,55,.07) !important;
  color:#c65c12 !important;
}

/* Cartes : même finition sur tout le site sans changer leurs dimensions */
.service,.card,.training-card,.format-card,.article-card,.usecase-photo,
.agent-visual-card,.hero-visual,.article-teaser,.attention-card{
  border-color:var(--srit-line) !important;
  border-radius:var(--srit-radius) !important;
}
.service,.card,.training-card,.format-card,.article-card,.article-teaser,.attention-card{
  box-shadow:var(--srit-shadow) !important;
}
.service:hover,.card:hover,.training-card:hover,.article-card:hover{
  box-shadow:0 18px 40px rgba(14,43,82,.12) !important;
}

/* Liens éditoriaux */
a{transition:color .18s ease,opacity .18s ease}
.article a,.main a,.training-card a{font-weight:700}

/* Footer */
.footer{
  border-top:1px solid rgba(209,222,239,.9) !important;
  background:#f8fafc !important;
  color:#5a6f8c !important;
}

/* Mobile : même logique de navigation partout */
.mobile-menu-toggle{
  border-radius:12px !important;
}
.mobile-nav{
  border:1px solid var(--srit-line) !important;
  border-radius:16px !important;
  box-shadow:0 18px 40px rgba(12,39,76,.14) !important;
  background:#fff !important;
}
.mobile-nav a{
  color:#203a60 !important;
  font-weight:700 !important;
}
.mobile-nav a:hover{background:#f5f8fd !important;color:var(--srit-blue) !important}

@media(max-width:1100px){
  .nav{gap:14px !important}
  .nav a{font-size:13px !important}
}
@media(max-width:950px){
  .nav{display:none !important}
  .topbar .inner{min-height:68px !important}
  .container{width:auto !important;margin-left:18px !important;margin-right:18px !important}
}

</style></head>
<body><div class="card"><h1>Merci, votre demande a bien été envoyée.</h1>
<p>SR-IT a reçu votre formulaire. Vous serez recontacté prochainement.</p>
<a href="/">Retour au site</a></div></body></html>
